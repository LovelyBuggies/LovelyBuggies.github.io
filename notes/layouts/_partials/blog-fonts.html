{{/* Publish the font licenses alongside their downloads. */}}
{{- range resources.Match "fonts/*-OFL.txt" }}
  {{- $_ := .RelPermalink }}
{{- end }}
<style>
  @font-face {
    font-family: 'Inter';
    src: url('{{ (resources.Get "fonts/inter-latin.woff2").RelPermalink }}') format('woff2');
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: 'Source Serif 4';
    src: url('{{ (resources.Get "fonts/source-serif-4-latin.woff2").RelPermalink }}') format('woff2');
    font-style: normal;
    font-weight: 200 900;
    font-display: swap;
  }
</style>
