{{- $src := partial "article-image-url" (dict "Page" .Page "Destination" (.Get "src")) -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $id := printf "article-image-%d" .Ordinal -}}
<button type="button" class="article-image{{ with .Get "class" }} {{ . }}{{ end }}" popovertarget="{{ $id }}" aria-label="{{ i18n "enlargeImage" ($alt | default (i18n "image")) }}">
  <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy">
</button>
<div class="article-image-viewer" popover id="{{ $id }}">
  <button type="button" popovertarget="{{ $id }}" popovertargetaction="hide" aria-label="{{ i18n "closeImage" }}">×</button>
  <div class="article-image-scroll" tabindex="0" role="region" aria-label="{{ $alt | default (i18n "image") }}">
    <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy">
  </div>
</div>
