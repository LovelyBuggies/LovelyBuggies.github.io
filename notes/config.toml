baseURL = "https://lovelybuggies.github.io/notes/"
title = "Shuo's Blog"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
cleanDestinationDir = true
publishDir = "public"

[params]
  authorName = "Shuo Liu"
  description = "Shuo Liu's articles on reinforcement learning, multi-agent systems, and language models."

[languages.en]
  languageCode = "en-US"
  languageName = "English"
  weight = 1

[languages.zh]
  languageCode = "zh-CN"
  languageName = "中文"
  hasCJKLanguage = true
  weight = 2
  [languages.zh.params]
    description = "Shuo Liu 关于强化学习、多智能体系统与语言模型的文章。"

[taxonomies]
  tag = "tags"

[markup.highlight]
  style = "github"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
  typographer = false

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)'], ['$', '$']]
